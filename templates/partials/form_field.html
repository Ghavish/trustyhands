{# Usage: {% include "partials/form_field.html" with field=form.email %} #}
<div class="form-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<span class="helptext">{{ field.help_text|safe }}</span>{% endif %}
  {{ field.errors }}
</div>
